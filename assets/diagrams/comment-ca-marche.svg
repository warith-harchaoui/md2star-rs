<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1237 432" width="1237" height="432" role="img" aria-labelledby="m2rf-title m2rf-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="m2rf-title">Comment md2star-rs fonctionne : du Markdown en entrée, un .docx ou un .pptx en sortie, sans aucun Pandoc</title>
  <desc id="m2rf-desc">Une planche qui se lit de gauche à droite. Entrée : du Markdown, sous forme de chaîne ou de fichier. Le travail, en trois étapes numérotées : pulldown-cmark lit le flux d'événements CommonMark puis GFM ; ces événements sont repliés dans l'AST de blocs et d'éléments en ligne propre à ce crate, qui est la couture lecteur-écrivain que Pandoc utilise en interne ; puis l'un des deux écrivains émet le document, docx-rs pour Word ou l'écrivain PresentationML pour une présentation. Sortie : un fichier .docx ou .pptx, déterministe à l'octet près, si bien qu'une nouvelle exécution produit les mêmes octets. Dessous, un seul crate qui interdit le code unsafe puis documente chaque élément public, sans sous-processus ni installation de Pandoc. On l'atteint par trois surfaces : une API Rust, trois lignes de commande clap derrière une option de compilation, puis un skill d'agent. La légende rappelle que l'AST nommé du milieu est ce qui permet à un second moteur de s'insérer sans toucher au lecteur.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="m2rf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">ENTRÉE</text>
  <rect class="io" x="28" y="87" width="168" height="78" rx="10"/>
  <text class="n-title" x="112" y="120" text-anchor="middle">du Markdown</text>
  <text class="n-sub" x="112" y="139" text-anchor="middle">chaîne ou fichier</text>
  <path class="flow" d="M202 126 H218" marker-end="url(#m2rf-arrow)"/>
  <rect class="panel" x="222" y="54" width="772" height="144" rx="12"/>
  <text class="panel-label" x="242" y="76">CE QU'ELLE FAIT</text>
  <rect class="stage" x="242" y="94" width="208" height="78" rx="10"/>
  <text class="n-title" x="346" y="127" text-anchor="middle">lire</text>
  <text class="n-sub" x="346" y="146" text-anchor="middle">événements pulldown-cmark</text>
  <text class="step" x="253" y="110">1</text>
  <path class="flow" d="M454 133 H470" marker-end="url(#m2rf-arrow)"/>
  <rect class="stage" x="476" y="94" width="254" height="78" rx="10"/>
  <text class="n-title" x="603" y="127" text-anchor="middle">replier dans l'AST</text>
  <text class="n-sub" x="603" y="146" text-anchor="middle">la couture lecteur / écrivain</text>
  <text class="step" x="487" y="110">2</text>
  <path class="flow" d="M734 133 H750" marker-end="url(#m2rf-arrow)"/>
  <rect class="stage" x="756" y="94" width="218" height="78" rx="10"/>
  <text class="n-title" x="865" y="127" text-anchor="middle">écrire</text>
  <text class="n-sub" x="865" y="146" text-anchor="middle">docx-rs, ou PresentationML</text>
  <text class="step" x="767" y="110">3</text>
  <path class="flow" d="M1000 126 H1016" marker-end="url(#m2rf-arrow)"/>
  <text class="panel-label" x="1020" y="40">SORTIE</text>
  <rect class="io" x="1020" y="87" width="189" height="78" rx="10"/>
  <text class="n-title" x="1114" y="120" text-anchor="middle">.docx ou .pptx</text>
  <text class="n-sub" x="1114" y="139" text-anchor="middle">sortie déterministe à l'octet</text>
  <rect class="core" x="392" y="232" width="432" height="54" rx="10"/>
  <text class="on-dark" x="608" y="253" text-anchor="middle">un seul crate, aucun unsafe, aucun sous-processus</text>
  <text class="on-dark-sub" x="608" y="272" text-anchor="middle">un binaire statique unique — aucun Pandoc à installer</text>
  <path class="tie" d="M608 286 V314 H408 V332"/>
  <path class="tie" d="M608 314 H808 V332"/>
  <path class="tie" d="M608 314 V332"/>
  <rect class="surface" x="318" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="408" y="360" text-anchor="middle">API Rust</text>
  <rect class="surface" x="518" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="608" y="360" text-anchor="middle">CLI (clap, en option)</text>
  <rect class="surface" x="718" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="808" y="360" text-anchor="middle">skill d'agent</text>
  <text class="caption" x="608" y="412" text-anchor="middle">L'AST nommé du milieu est tout l'intérêt : un second moteur s'y insère sans toucher au lecteur, ce qui explique comment le .pptx est arrivé après le .docx.</text>
</svg>
