# md2star-rs — a pure-Rust Markdown → DOCX writer, no Pandoc, no subprocess.
#
# The Python `md2star` is a thin wrapper around Pandoc; this spin-off keeps the same
# *goal* (Markdown in, a faithful .docx out) but reaches it with an all-Rust reader →
# AST → writer pipeline (`pulldown-cmark` → our IR → `docx-rs`). The payoff is a single
# static binary that runs on every OS/device with no Pandoc install — see README.md for
# the scope/trade-offs versus the Pandoc-backed original.
[package]
name = "md2star-rs"
version = "0.4.4"
edition = "2021"
# Verified, not guessed: `cargo test --all` passes on a real 1.88.0 toolchain and fails on
# 1.85.0. The floor comes from the dependency tree (image, time, zip), not from this
# crate's own code; the 1.74 declared until 0.4.3 had quietly stopped being true.
rust-version = "1.88"
license = "Apache-2.0"
description = "Pure-Rust Markdown → DOCX and PPTX writer (pulldown-cmark → AST → docx-rs / ppt-rs). A Pandoc-free spin-off of md2star."
repository = "https://github.com/warith-harchaoui/md2star-rs"
homepage = "https://deraison.ai/ai-helpers"
documentation = "https://docs.rs/md2star-rs"
authors = ["Warith HARCHAOUI <warithmetics@deraison.ai>"]
readme = "README.md"
keywords = ["markdown", "docx", "pptx", "powerpoint", "pandoc-free"]
categories = ["command-line-utilities", "text-processing"]

# The library is the reusable core (also the future WASM entry point); the two binaries are
# the `md2docx` / `md2pptx` CLIs that mirror the original md2star command names.
[lib]
name = "md2star_rs"
path = "src/lib.rs"

[[bin]]
# Named after the crate, and therefore unable to collide with anything the
# Python `md2star` installs. `md2docx` and `md2pptx` below keep working
# unchanged — this adds a certain option rather than removing a familiar one.
name = "md2star-rs"
path = "src/bin/md2star-rs.rs"
required-features = ["cli"]

[[bin]]
name = "md2docx"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "md2pptx"
path = "src/bin/md2pptx.rs"
required-features = ["cli"]

[features]
# On by default so `cargo install md2star-rs` still yields the three binaries.
# Library consumers turn it off with `default-features = false`.
default = ["cli", "legacy-pptx", "svg"]
cli = ["dep:clap"]
# The v0.4 PPTX writer on ppt-rs (src/pptx/legacy.rs). ppt-rs pulls zip 0.6 with its
# default features, which compile bzip2 and zstd from C: that C is what a pure-Rust core
# for iOS/Android cannot carry, so it lives behind this feature until the PPTX port
# replaces it with a pure-Rust PresentationML writer. `--no-default-features` builds
# without it (and PPTX output then answers "not ported yet").
legacy-pptx = ["dep:ppt-rs"]
# SVG images in DOCX get the PNG fallback Word requires, rasterised in process by resvg
# (pure Rust). Without it an SVG is embedded behind a transparent placeholder.
svg = ["dep:resvg"]
# In-process PDF output (src/pdf.rs): Markdown → Typst markup → PDF, compiled in memory
# by the typst crates with embedded fonts. Raises the MSRV to 1.92 for this feature only
# (Typst 0.15's floor); everything else keeps 1.88.
pdf = ["dep:typst", "dep:typst-pdf", "dep:typst-layout", "dep:typst-assets"]
# Mermaid → SVG in process (src/mermaid.rs), used by the writers when compiled in.
mermaid = ["dep:mermaid-rs-renderer"]
# Fetch `http(s)://` images (still opt-in per conversion: --allow-remote-images).
# Off by default: the core makes no network access and needs no TLS stack.
net = ["dep:ureq"]
# Model-assisted layout selection through an OpenAI-compatible endpoint (src/llm.rs).
llm = ["net"]

[dependencies]
# CommonMark + GFM reader. We drive it in *event* mode and fold the flat event stream into
# our own block/inline AST, exactly the reader/writer seam Pandoc uses internally.
pulldown-cmark = { version = "0.13", default-features = false }
# The OOXML writer. Unlike Pandoc we own `styles.xml`, so nothing gets stripped after the
# fact — this is what makes the original md2star's `postprocess.py` zip-surgery unnecessary.
docx-rs = "0.4"
# The PresentationML (.pptx) writer for `md2pptx`. Its lean default feature set (thiserror,
# uuid, xml-rs, zip) is the same league as docx-rs; the heavy `cli`/`mcp`/`web2ppt` features
# stay off. It ships the slide-master/layout/theme scaffolding a deck needs, and its output is
# byte-deterministic (fixed doc timestamp, stable ids) so md2pptx stays idempotent like md2docx.
# Pinned exactly: 0.2.23 through 0.2.25 don't compile with `default-features = false`
# (`src/export/slide_render.rs` names `pdfrs` outside the feature gate that pulls it in).
# Our Cargo.lock hid this locally — a fresh `cargo install md2star-rs` resolves the caret
# range to the newest patch and fails. Filed upstream as
# https://github.com/yingkitw/ppt-rs/issues/11 — unpin once that lands. Re-checked
# 2026-10-02: the issue is still open and 0.2.27 still fails the same way (verified by
# building a scratch crate against `ppt-rs = "0.2", default-features = false`), so the
# pin stays.
ppt-rs = { version = "=0.2.22", default-features = false, optional = true }
# Typed error enums for the library surface — no stringly-typed errors leaking to callers.
thiserror = "2"
# Argument parsing for the binaries (derive keeps the CLI declaration close to the struct
# it fills). Optional behind the default `cli` feature, as in every other crate of the
# suite: a library consumer of `md2star_rs` must not compile an argument parser it never
# calls. `default-features = false` drops it.
clap = { version = "4", features = ["derive"], optional = true }
# Used by the PPTX path to re-pack ppt-rs's output deterministically: ppt-rs stamps a
# wall-clock timestamp into docProps/core.xml, so we rewrite that one part to a fixed value
# and repack with a fixed entry mtime — restoring byte-idempotence. (Also our test dev-dep.)
# Deflate only: zip's default features compile bzip2 and zstd from C, which a pure-Rust
# core for iOS/Android cannot carry. (ppt-rs still pulls zip 0.6 with those defaults —
# see the PPTX port.)
zip = { version = "2", default-features = false, features = ["deflate"] }
# YAML front matter. Pure Rust, YAML 1.2, no serde: we convert its tree to our own
# `MetaValue` so the AST does not leak a third-party type.
yaml-rust2 = { version = "0.13", default-features = false }
# Image format + pixel size from the header bytes only (no decoding), pure Rust, no deps.
imagesize = "0.15"
# `data:` URIs embed images as base64.
base64 = "0.22"
# Reading OOXML back (twin, audit, PPTX templates): one streaming XML reader for all three.
# 0.41 because docx-rs already pulls it in: one copy in the tree, not two.
quick-xml = "0.41"
# HTTP for remote images (feature `net`), with bounded timeouts. rustls, no OpenSSL.
ureq = { version = "3", optional = true }

# --- phase 2: each port appends its own dependencies below its marker, nowhere else ---
# DOCX port:
# SVG → PNG for the raster fallback Word needs under an SVG picture (feature `svg`). Pure
# Rust (usvg + tiny-skia); no system fonts from memory maps, no compressed `.svgz`, no
# raster images embedded inside SVGs: what diagrams in documents need, nothing else.
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts"], optional = true }
# PPTX port:
# twin + PDF port:
# Typst as a library: the compiler, its PDF exporter, its layout engine (where
# `PagedDocument` lives) and its fonts (Libertinus Serif, New Computer Modern + Math,
# DejaVu Sans Mono), embedded so a phone needs no system font. Pure Rust except `psm`
# (via `stacker`), which assembles stack-switching code with the target's C toolchain.
typst = { version = "0.15", optional = true }
typst-pdf = { version = "0.15", optional = true }
typst-layout = { version = "0.15", optional = true }
typst-assets = { version = "0.15", features = ["fonts"], optional = true }
# Mermaid → SVG without a browser. `default-features = false` drops its CLI and the
# resvg-based PNG output.
mermaid-rs-renderer = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
# Write generated .docx files into a throwaway dir instead of polluting the repo.
tempfile = "3"
# Crack open the produced .docx (a zip) in tests to assert on `word/document.xml`.
zip = { version = "2", default-features = false, features = ["deflate"] }
