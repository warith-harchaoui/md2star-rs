name: CI

# Deliberately light: one Linux job, nothing else. The heavy, cross-platform,
# network-touching testing is a *local* responsibility — `.githooks/pre-push`
# runs the same four gates before a push can even leave the machine, so by the
# time this workflow starts, everything in it has already passed once. CI is the
# confirmation, not the first run. (A three-OS matrix lived here until
# 2026-10-02; it tripled the cost to re-prove what the pre-push gate proves, and
# every job still blocks, so nothing merges red.)
on:
  push:
  pull_request:

# A burst of pushes to the same branch should cost one run, not one per commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Treat warnings as errors everywhere, not just in the clippy step.
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # A hung job must not ride GitHub's 6-hour default: this one takes
    # well under two minutes, so anything near the ceiling is a hang.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable + rustfmt + clippy + the iOS and Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-ios, aarch64-linux-android

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      # Formatting is a fast, deterministic gate — run it first so a whitespace slip fails
      # in seconds rather than after a full build.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      # Every feature compiles on Ubuntu (pdf, mermaid, llm, net): Warith's rule for
      # each Rust crate of the suite. Clippy builds it, and lints it on the way.
      - name: Clippy, all features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests (unit + integration + doc-tests)
        run: cargo test --all

      # The cross-device claim, checked rather than asserted: the core type-checks for
      # iOS and Android bare, with SVG rasterising, and with the PDF writer and Mermaid.
      # `cargo check` needs the target's standard library but no linker and no SDK, so a
      # Linux runner proves it. Typst's `psm` assembles a few lines with the target's C
      # toolchain: the runner's clang does it for both targets (an app build uses Xcode's
      # or the NDK's).
      - name: Cross-device check (iOS, Android — core library)
        env:
          CC_aarch64_linux_android: clang
          AR_aarch64_linux_android: ar
          CC_aarch64_apple_ios: clang
          AR_aarch64_apple_ios: ar
        run: |
          for target in aarch64-apple-ios aarch64-linux-android; do
            cargo check --lib --no-default-features --target "$target"
            cargo check --lib --no-default-features --features svg --target "$target"
            cargo check --lib --no-default-features --features svg,pdf,mermaid --target "$target"
          done

      # The steps above all build against the committed Cargo.lock, which pins dependency
      # versions no downstream consumer ever sees: a range that has gone bad stays green
      # here while breaking every fresh `cargo add` / `cargo install`. (md2star-rs 0.4.0
      # shipped uninstallable for exactly this reason, with this matrix green.) A lock-free
      # resolve closes that blind spot.
      - name: Fresh resolve (no Cargo.lock — what a downstream consumer gets)
        run: ./scripts/check-fresh-resolve.sh
